<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171725"><meta name="description" content="ThaiNative คืนปลุกวิญญาณ เกมการ์ดภูติผีไทย chibi จัดเด็ค 40 ใบ อัญเชิญภูติ 100 ชนิด ท้าประลอง AI และผู้เล่นออนไลน์"><title>ThaiNative · คืนปลุกวิญญาณ</title><link rel="stylesheet" href="cards.css"><link rel="stylesheet" href="progress.css"></head>
<body>
<a class="skip-link" href="#main">ข้ามไปเนื้อหา</a>
<header class="site-header"><a class="brand" href="#home"><span class="brand-seal">✧</span><span>THAINATIVE<small>คืนปลุกวิญญาณ · CARD DUEL</small></span></a><nav class="main-nav" aria-label="เมนูหลัก"><button data-view="home" aria-current="page">หน้าหลัก</button><button data-view="collection">คลังภูติ <span>100</span></button><button data-view="deck">จัดเด็ค</button><button data-view="rules">วิธีเล่น</button></nav><div class="header-player"><span class="online-light" id="connection">กำลังเชื่อมต่อ</span><strong id="player-label">ผู้ผูกวิญญาณ</strong><details class="audio-menu"><summary aria-label="ตั้งค่าเสียง">♫</summary><div><button id="battle-music-toggle" aria-pressed="true">♫ เปิดเพลง</button><button id="sfx-toggle" aria-pressed="true">♪ เสียงเอฟเฟกต์</button></div></details></div></header>
<nav class="feature-nav" aria-label="กิจกรรมและความก้าวหน้า"><span id="wallet-label"></span><button data-view="journey">☽ ผจญภัย</button><button data-view="ritual">✦ เรียกภูติ</button><button data-view="progress">❀ ภารกิจ</button><button data-view="online">⚔ ออนไลน์</button><button data-view="history">▤ ประวัติ</button><button data-view="shop">◇ ของแต่ง</button><button data-view="account">♙ บัญชี</button></nav><main id="main" tabindex="-1"></main>
<footer class="site-footer"><span>✧ THAINATIVE · ร้อยภูติ คืนปลุกวิญญาณ</span><span>สะสมด้วยตั๋วจากการเล่น · ไม่มีการชำระเงินจริง</span></footer>
<details class="chat" id="chat-drawer"><summary>✉ แชทผู้ผูกวิญญาณ <span><b id="online-count">0</b> ออนไลน์</span></summary><div id="chat-lines" role="log" aria-live="polite" aria-label="ข้อความแชท"></div><form id="chat-form"><input id="chat-input" aria-label="ข้อความแชท" maxlength="180" placeholder="ทักทายเพื่อนร่วมทาง…" autocomplete="off"><button aria-label="ส่งข้อความ">➤</button></form></details>
<dialog id="card-dialog" aria-labelledby="detail-title"><button class="close-button" data-close aria-label="ปิดรายละเอียด">×</button><div id="card-detail"></div></dialog>
<dialog id="confirm-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title">ยอมแพ้การประลอง?</h2><p>คู่ต่อสู้จะเป็นผู้ชนะ และคุณจะกลับไปเริ่มเกมใหม่ได้</p><div class="button-row"><button class="secondary" data-close-confirm>เล่นต่อ</button><button class="primary" id="confirm-concede">ยอมแพ้</button></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<audio id="battle-music" src="assets/lobby-thai-varied.mp3" preload="none" loop></audio>
<script src="card-catalog.js"></script><script src="card-content.js"></script><script src="ui-sounds.js"></script><script src="game-audio.js"></script><script src="card-client.js"></script>
</body></html>
